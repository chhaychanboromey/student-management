# Public entry point: all requests go through the API gateway (Pod 1)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: pod1-gateway-registration
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
---
# Internal only: the gateway reaches the 2nd microservice (Pod 2) through this name
apiVersion: v1
kind: Service
metadata:
  name: student-service
spec:
  type: ClusterIP
  selector:
    app: pod2-student-service
  ports:
    - port: 4002
      targetPort: 4002
